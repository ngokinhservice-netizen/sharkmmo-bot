services:
  - type: web
    name: sharkmmo-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: BOT_TOKEN
        sync: false
      - key: CANBOSO_API_KEY
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: BANK_CODE
        sync: false
      - key: BANK_ACCOUNT_NO
        sync: false
      - key: BANK_ACCOUNT_NAME
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./sharkmmo.db
